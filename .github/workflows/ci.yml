name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: task_assignment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Mirrors backend/.env.example and frontend/.env.example. The .env files are
    # gitignored, and Bun / prisma.config.ts read process.env directly, so the
    # values live here instead. GEMINI_API_KEY is left empty so tests never
    # call the LLM.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/task_assignment?schema=public
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ""
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Migrate and seed database
        run: |
          bun --filter backend db:deploy
          bun --filter backend db:seed

      - name: Test
        run: bun run test
