# Postgres only — the backend and frontend run on the host with `bun dev`.
#
# Credentials come from the repo-root `.env` (gitignored; copy `.env.example`).
# `:?` means compose refuses to start rather than falling back to a default
# password, so a missing variable can never boot a weakly-secured database.
services:
  postgres:
    image: postgres:18-alpine
    container_name: task-assignment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ escapes the interpolation: this reads the container's own env.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
