# Postgres only — the backend and frontend run on the host with `bun dev`.
services:
  postgres:
    image: postgres:18-alpine
    container_name: task-assignment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_assignment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_assignment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
