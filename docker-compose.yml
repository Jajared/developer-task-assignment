# The whole stack: Postgres, a one-shot migrate+seed job, the backend API and
# the Next.js frontend. `docker compose up --build` (or `bun run docker:up`)
# brings up a working app at http://localhost:3000 with no other step: the
# `migrate` service runs `prisma migrate deploy` and the seed, both idempotent,
# and the backend waits for it to finish. For host development run only
# `bun run db:up` (Postgres) and `bun dev`.
#
# Every variable comes from the repo-root `.env` (gitignored; copy
# `.env.example`). `:?` means compose refuses to start rather than falling back
# to a default password, so a missing variable can never boot a weakly-secured
# database. DATABASE_URL is derived from the same POSTGRES_* values, so the two
# can never disagree.
x-database-url: &database-url
  postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}?schema=public

services:
  postgres:
    image: postgres:18-alpine
    container_name: task-assignment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ escapes the interpolation: this reads the container's own env.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      # The official image initialises, then restarts once on first boot;
      # don't count a pass during that first phase.
      start_period: 10s

  # Runs once per `up`, then exits. Same image as the backend so the code that
  # migrates is the code that serves; `restart: "no"` keeps Compose from
  # re-running it. Safe to repeat: applied migrations are skipped and the seed
  # only fills what is missing. The backend container itself never migrates.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: task-assignment-backend
    container_name: task-assignment-migrate
    restart: "no"
    command: ["sh", "-c", "bun run db:deploy && bun run db:seed"]
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: task-assignment-backend
    container_name: task-assignment-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: *database-url
      # Must match the origin the browser loads the frontend from.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image has no curl; Bun's fetch does the job.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Inlined at build time: the URL the *browser* calls the API on.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: task-assignment-frontend
    container_name: task-assignment-frontend
    restart: unless-stopped
    environment:
      # Runtime, server-side only: server components reach the API over the
      # compose network.
      API_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres-data:
